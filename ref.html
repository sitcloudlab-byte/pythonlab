<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex No. 5 - Scrollspy Example</title>

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <style>
        body {
            position: relative;
        }

        section {
            padding: 100px 20px;
            height: 500px;
        }

        nav a.active {
            font-weight: bold;
            color: pink !important;
        }
    </style>
</head>

<body data-spy="scroll" data-target="#navbarexample" data-offset="60">

    <nav id="navbarexample"
         class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">

        <a class="navbar-brand" href="#">Scrollspy</a>

        <ul class="navbar-nav ml-auto">
            <li class="nav-item">
                <a class="nav-link" href="#section1">Home</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#section2">About</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#section3">Contact</a>
            </li>
        </ul>
    </nav>

    <section id="section1" class="bg-light">
        <h2>Home</h2>
        <p>Welcome to the Scrollspy example.</p>
    </section>

    <section id="section2" class="bg-danger text-white">
        <h2>About</h2>
        <p>This section explains the Scrollspy.</p>
    </section>

    <section id="section3" class="bg-success text-white">
        <h2>Contact</h2>
        <p>This is the final section.</p>
    </section>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
